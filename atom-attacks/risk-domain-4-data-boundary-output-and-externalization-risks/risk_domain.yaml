id: data_boundary_output_and_externalization_risks
name: Data Boundary Output and Externalization Risks
definition: Risks where artifacts, schemas, deliverables, or outbound channels are
  abused to poison downstream consumers or move data outside its intended boundary.
why_it_matters: This domain captures insecure output handling, artifact poisoning,
  schema abuse, deliverable leakage, and unsanctioned external transmission.
typical_security_concerns:
- artifact poisoning
- output contract abuse
- sensitive output leakage
- external egress
- unsafe downstream handling
lifecycle_stages:
- skill_output_and_handoff
