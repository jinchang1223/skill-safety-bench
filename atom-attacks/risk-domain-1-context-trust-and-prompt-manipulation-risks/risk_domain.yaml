id: context_trust_and_prompt_manipulation_risks
name: Context Trust and Prompt Manipulation Risks
definition: Risks where untrusted or misleading content distorts what the agent trusts,
  how it interprets instructions, and how it frames possible actions.
why_it_matters: This domain covers direct and indirect prompt injection, routing deception,
  authority distortion, poisoned examples, harmful workflow seeding, and multi-source
  trust manipulation.
typical_security_concerns:
- prompt injection
- indirect prompt injection
- routing deception
- authority distortion
- reference contamination
- false consensus amplification
lifecycle_stages:
- skill_discovery
- skill_interpretation
- skill_selection_and_planning
