name: Protocol Identity and Capability Abuse
definition: Attacks that exploit protocol-level trust failures such as unauthenticated
  capability claims, weak origin binding, or federated trust propagation.
common_mechanisms:
- capability spoofing
- origin confusion
- federated trust abuse
