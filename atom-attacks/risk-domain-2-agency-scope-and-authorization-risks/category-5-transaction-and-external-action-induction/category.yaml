id: transaction_and_external_action_induction
risk_domain: agency_scope_and_authorization_risks
lifecycle_stages:
- skill_selection_and_planning
- skill_execution
name: Transaction and External Action Induction
definition: Attacks that coerce the agent into initiating high-impact external actions
  such as payments, account changes, or third-party operations.
common_mechanisms:
- payment initiation
- account recovery abuse
- external service mutation
